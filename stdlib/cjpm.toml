[package]
  cjc-version = "0.57.3"
  compile-option = ""
  description = "lucida: optics for the standard library's own types"
  link-option = ""
  name = "lucida_stdlib"
  output-type = "static"
  override-compile-option = ""
  src-dir = "src"
  target-dir = ""
  version = "1.0.0"
  license = ["MIT"]
  package-configuration = {}

[dependencies]
  lucida = { path = "../core" }

[profile.build]
  performance_analysis = true


[profile.customized-option]
  rel = "-O2"
  dbg = "-O0 -g --debug-macro -Woff unused"
