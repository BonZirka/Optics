[dependencies]
  lucida = { path = "../core" }
  lucida_stdlib = { path = "../stdlib" }

[package]
  cjc-version = "0.57.3"
  compile-option = ""
  description = "Runnable demo and benchmarks for the lucida optics library"
  link-option = ""
  name = "optics_experiments"
  output-type = "executable"
  override-compile-option = ""
  src-dir = "."
  target-dir = ""
  version = "1.0.0"
  license = ["MIT"]
  package-configuration = {}

[profile.build]
  performance_analysis = true

[profile.build.lto]
  level = "thin"

[profile.test.build]
  compile-option = "-Woff unused"

[profile.bench.build]
  compile-option = "-Woff unused"

[profile.customized-option]
  rel = "-O2"
  dbg = "-O0 -g --debug-macro -Woff unused"
