[dependencies]
  lucida = { path = ".." }

[package]
  cjc-version = "0.57.3"
  compile-option = "-O2 --debug-macro --experimental --lto=thin"
  description = "Runnable demo and benchmarks for the lucida optics library"
  link-option = ""
  name = "optics_experiments"
  output-type = "executable"
  override-compile-option = ""
  src-dir = "."
  target-dir = ""
  version = "1.0.0"
  license = ["MIT"]
  package-configuration = {}

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["${CANGJIE_STDX_PATH}"]
