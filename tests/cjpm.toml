[package]
  cjc-version = "0.57.3"
  compile-option = ""
  description = "lucida: the law suite, feature tests and the @InlineOptics harness"
  link-option = ""
  name = "tests"
  output-type = "static"
  override-compile-option = ""
  src-dir = "src"
  target-dir = ""
  version = "1.0.0"
  license = ["MIT"]
  package-configuration = {}

[dependencies]
  lucida = { path = "../core" }
  lucida_stdlib = { path = "../stdlib" }

[profile.build]
  performance_analysis = true

# The generated shapes in src/generated are the benchmark matrix, so they are
# built the way examples builds its benchmarks: thin LTO, and warnings off for
# the test and bench profiles. Without this the recorded numbers would come from
# a differently optimised binary than the one they were measured on.
[profile.build.lto]
  level = "thin"

[profile.test.build]
  compile-option = "-Woff unused"

[profile.bench.build]
  compile-option = "-Woff unused"

[profile.customized-option]
  rel = "-O2"
  dbg = "-O0 -g --debug-macro -Woff unused"
